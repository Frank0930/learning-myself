<p class="eyebrow">旅遊 Vlog · 隨身複習</p><h1>Wide 的空間交代用途</h1><div class="scene">讓觀眾知道人物在哪種地方，以及人物與環境的關係。</div><ol><li>找有辨識力的環境線索。</li><li>選擇能容納必要線索的取景位置。</li><li>檢查人物與主要空間是否容易辨認。</li></ol><p>拉麵店示例：旅伴、吧台、開放廚房。無須把所有角落都拍到。</p><p>Wide 是取景範圍，不等於手機 0.5×。交代場景也可用其他畫面完成，不必每段都從 Wide 開始。</p><p>依據：<a href="https://www.adobe.com/creativecloud/video/production/cinematography/camera-shots-and-angles/establishing-shot.html">Adobe：建立場景鏡頭</a>；以上步驟是課程練習方法。</p><p><a href="../lessons/0004-wide-place-context.html">回到課程與練習</a> · <a href="0003-action-framing-card.html">動作取景複習卡</a></p>
