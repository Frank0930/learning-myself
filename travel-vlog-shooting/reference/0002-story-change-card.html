<p class="eyebrow">旅遊 Vlog · 隨身複習</p><h1>感受，能從畫面看出來嗎？</h1><ol><li>先說一句話：發生了什麼？我的狀態有什麼變化？</li><li>找具體動作：觀眾會看到什麼，而不只是你心裡想表達什麼？</li><li>檢查自然程度：這個動作當下真的發生了嗎？</li></ol>
<div class="scene">例：走了一整天 → 到飯店 → 放下行李、坐下休息。</div><p>房間與夜景能提供空間和氛圍；人物動作能提供感受的線索。不必每段都有情緒變化，也不必每次都拍人臉。</p><p>依據：<a href="https://www.adobe.com/uk/creativecloud/video/production/cinematography/camera-shots-and-angles.html">Adobe：鏡頭種類與反應鏡頭</a>。本卡是課程練習方法，不是固定拍攝公式。</p><p><a href="../lessons/0002-visible-story-change.html">回到課程與練習</a> · <a href="0001-learning-route.html">學習路線</a></p>
</main></body></html>
