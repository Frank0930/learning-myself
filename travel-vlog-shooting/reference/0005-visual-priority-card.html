<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅遊 Vlog｜畫面主次</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><p class="eyebrow">旅遊 Vlog · 隨身複習</p><h1>Wide 也要有主角</h1><ol><li>這段最想讓觀眾注意什麼？</li><li>主要元素在畫面裡清楚嗎？</li><li>其他元素是在襯托，還是占了太多畫面？</li></ol><div class="scene">「終於能休息」示例：床為主，夜景補氛圍，地板留少量。</div><p>元素不必全部拍齊。個人聯想也不等於觀眾一定能推知的事實。</p><p>主角不必完整入鏡。半張床也可以，只要辨識清楚、裁切符合用途，且仍保留這個鏡頭所需的空間資訊。交代床的大小或配置時，較完整的畫面可能更有用。</p><p>依據：<a href="https://www.adobe.com/uk/creativecloud/video/production/cinematography/camera-shots-and-angles.html">Adobe：構圖引導視線</a>；以上為課程練習方法。</p><p><a href="../lessons/0005-wide-visual-priority.html">回到課程</a> · <a href="0004-wide-card.html">Wide 複習卡</a></p></main></body></html>
