<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅遊 Vlog｜時長複習卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><p class="eyebrow">旅遊 Vlog · 隨身複習</p><h1>素材時長 ≠ 成片時長</h1><div class="scene">本次固定 Wide 練習：錄約 8 秒，挑其中約 3 秒試看。</div><p>秒數是練習起點，依畫面資訊與故事需求調整。</p><ol><li>構圖、站穩後再錄。</li><li>維持固定畫面，停止錄影後再放下手機。</li><li>挑清楚、穩定、能交代所需資訊的部分。</li></ol><p>本卡只針對固定環境鏡頭，不直接套用人物動作或運鏡。</p><p>操作參考：<a href="https://support.apple.com/en-ca/104968">Apple：修剪影片</a>。</p><p><a href="../lessons/0006-recording-and-edit-duration.html">回到課程與實拍練習</a></p></main></body></html>
